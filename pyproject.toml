[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "omr-python-for-foss"
dynamic = ["version"]
description = "A FOSS Python OMR (Optical Mark Recognition) library with a name-preserving port of the Aspose.OMR for .NET public API surface (Layers 0-2: foundation, generation, recognition)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "omr-python-for-foss contributors" }]
keywords = ["omr", "optical mark recognition", "bubble sheet", "scantron", "aspose"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.6",
    "Pillow>=9.2",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/omr-python-for-foss/omr-python-for-foss"
Repository = "https://github.com/omr-python-for-foss/omr-python-for-foss"
Issues = "https://github.com/omr-python-for-foss/omr-python-for-foss/issues"

[tool.setuptools.dynamic]
version = { attr = "omr.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["omr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
